name: Windows build (Paulo / MCP)

# Builds the Windows installer of the personal MCP build and keeps it as a
# workflow artifact only: nothing is published (see LICENSE-ASSETS.md).

on:
  push:
    branches: [paulo-mcp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      # rmcp (the MCP SDK) needs Rust 1.88 or newer.
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: paulo-windows-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: paulo-windows-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Front-end tests
        run: npm test

      - name: Build the hook relay
        run: cargo build --release -p bifrost-hook

      - name: Rust tests
        run: cargo test -p bifrost-desktop --lib

      # PDFium (BSD-3/Apache-2.0, bblanchon/pdfium-binaries) vai dentro do
      # instalador (tauri.windows.conf.json): PDF → PNG/JPG funciona sem baixar.
      - name: Fetch PDFium for bundling
        shell: pwsh
        run: |
          $dir = "src-tauri/pdfium"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $tgz = Join-Path $env:RUNNER_TEMP "pdfium.tgz"
          Invoke-WebRequest "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7881/pdfium-win-x64.tgz" -OutFile $tgz
          $x = Join-Path $env:RUNNER_TEMP "pdfium"
          New-Item -ItemType Directory -Force $x | Out-Null
          tar -xzf $tgz -C $x
          Copy-Item (Join-Path $x "bin/pdfium.dll") "$dir/pdfium.dll"
          Copy-Item (Join-Path $x "LICENSE") "$dir/LICENSE"
          Get-ChildItem $dir | Format-Table Name, Length

      - name: Build and pack the installer
        shell: pwsh
        run: |
          npm run pack
          Get-ChildItem release | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Bifrost-Paulo-MCP-Windows
          path: |
            windows/release/*.exe
            windows/release/*.msi
            windows/target/release/bifrost-desktop.exe
            windows/target/release/bifrost-hook.exe
          retention-days: 14
