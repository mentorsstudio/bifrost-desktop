<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Bifrost — movimento</title>
    <style>
      body { margin: 0; min-height: 100vh; font-family: "Segoe UI", sans-serif; color: #F0EADB; overflow: hidden; }
      .stage { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; padding: 70px 40px 20px; }
      .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px; }
      .cell span { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #F0EADB; font-family: "Palatino Linotype", Georgia, serif; }
      h1 { position: relative; z-index: 1; margin: 22px 40px 0; }
      .bar { position: relative; z-index: 1; margin: 10px 40px; }
    </style>
  </head>
  <body class="bf-sky">
    <div class="bf-aurora"></div>
    <h1 class="bf-title"><span class="bf-rune">ᛒ</span><span>Huginn &amp; Muninn — estados</span></h1>
    <div class="bar bf-bridge"></div>
    <div class="stage" id="stage"></div>
    <script type="module" src="./motion.ts"></script>
  </body>
</html>
