<!doctype html><html><head><style>html,body{margin:0;background:transparent}
#i{width:1024px;height:1024px;border-radius:220px;background:radial-gradient(700px 500px at 30% 10%,rgba(145, 181, 160,.35),transparent 60%),radial-gradient(600px 500px at 90% 0%,rgba(180,124,255,.35),transparent 60%),linear-gradient(180deg,#142D28,#10231F);display:grid;place-items:center;position:relative;overflow:hidden}
#i::after{content:"";position:absolute;left:120px;right:120px;bottom:90px;height:22px;border-radius:12px;background:linear-gradient(90deg,#ff6b6b,#f2b84b,#f6e36a,#91B5A0,#C9DCCF,#F0EADB)}
#i .bf-mascot{width:860px;height:860px;margin-top:-40px}</style></head>
<body><div id="i"></div><script type="module">
import "../src/bifrost/nordic.css"; import { mascotSvg } from "../src/bifrost/mascots";
document.getElementById("i").innerHTML = `<div class="bf-mascot bf-huginn">${mascotSvg("huginn")}</div>`;
document.querySelector(".bf-raven-shadow").remove();
</script></body></html>
